<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
  <title id="t">Kennedy Silva — Fullstack Developer</title>
  <desc id="d">A code editor window typing out a C# class: Kennedy Silva, fullstack developer in Lisbon, Portugal. Stack: C#, ASP.NET Core, React. Status: open to work. Three apps in production, 400+ code reviews.</desc>

  <style>
