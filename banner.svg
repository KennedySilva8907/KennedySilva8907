    <clipPath id="c2"><rect x="96" y="162" width="0" height="30"><animate attributeName="width" values="0;0;880;880;0;0" keyTimes="0;0.200;0.267;0.900;0.930;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="96" y="200" width="0" height="30"><animate attributeName="width" values="0;0;880;880;0;0" keyTimes="0;0.275;0.342;0.900;0.930;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="96" y="238" width="0" height="30"><animate attributeName="width" values="0;0;880;880;0;0" keyTimes="0;0.350;0.417;0.900;0.930;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="96" y="276" width="0" height="30"><animate attributeName="width" values="0;0;880;880;0;0" keyTimes="0;0.425;0.492;0.900;0.930;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="96" y="314" width="0" height="30"><animate attributeName="width" values="0;0;880;880;0;0" keyTimes="0;0.500;0.567;0.900;0.930;1" dur="13s" repeatCount="indefinite"/></rect></clipPath>
