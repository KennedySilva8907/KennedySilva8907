    <g clip-path="url(#c1)"><text x="96" y="148"><tspan class="kw">public class</tspan><tspan class="id"> KennedySilva</tspan><tspan class="pl"> : </tspan><tspan class="ty">IFullstackDeveloper</tspan></text></g>
    <g clip-path="url(#c2)"><text x="96" y="186" class="pl">{</text></g>
