    <g clip-path="url(#c5)"><text x="144" y="300"><tspan class="kw">public string</tspan><tspan class="id"> Status</tspan><tspan class="pl"> =&gt; </tspan><tspan class="st">"Open to work"</tspan><tspan class="pl">;</tspan></text></g>
    <g clip-path="url(#c6)"><text x="96" y="338" class="pl">}</text></g>
