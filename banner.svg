  <rect x="8" y="8" width="984" height="384" rx="16" fill="url(#edge)"/>
  <rect x="10" y="10" width="980" height="380" rx="15" fill="#0D1117"/>

  <circle cx="44" cy="42" r="7" fill="#FF5F57"/>
  <circle cx="68" cy="42" r="7" fill="#FEBC2E"/>
  <circle cx="92" cy="42" r="7" fill="#28C840"/>
