<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img" aria-label="Kennedy Silva — Fullstack Developer, Lisbon">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1000" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="0.5" stop-color="#040c1c"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="240" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#card)"/>
    <ellipse cx="760" cy="120" rx="320" ry="200" fill="url(#glow)"/>

    <g stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1">
      <line x1="620" y1="260" x2="860" y2="-20"/>
      <line x1="700" y1="280" x2="960" y2="-20"/>
    </g>

    <!-- title bar -->
    <rect width="1000" height="42" fill="#050e22"/>
    <line x1="0" y1="42" x2="1000" y2="42" stroke="#17304d" stroke-width="1.5"/>
    <circle cx="26" cy="21" r="5" fill="#334155"/>
    <circle cx="46" cy="21" r="5" fill="#334155"/>
    <circle cx="66" cy="21" r="5" fill="#22d3ee" fill-opacity="0.6"/>
    <text x="500" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#475569">kennedysilva8907 — README.md</text>

    <!-- logo -->
    <g transform="translate(44,96) scale(1.15)">
      <rect width="64" height="64" rx="14" fill="#020617"/>
      <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.4" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.2"/>
      <path d="M8 20 L8 8 L20 8" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M44 56 L56 56 L56 44" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" fill="none"/>
      <text x="32" y="40" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="22" fill="#f1f5f9">KS</text>
    </g>

    <!-- content -->
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
      <text x="160" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#22d3ee">$ whoami</text>

      <text x="160" y="152" font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Kennedy Silva</text>

      <line x1="160" y1="172" x2="310" y2="172" stroke="url(#rule)" stroke-width="2.5" stroke-linecap="round"/>

      <text x="160" y="204" font-size="17" font-weight="400" fill="#94a3b8">Fullstack Developer</text>
      <text x="322" y="204" font-size="17" font-weight="400" fill="#334155">·</text>
      <text x="338" y="204" font-size="17" font-weight="400" fill="#94a3b8">C# · ASP.NET · React</text>
      <text x="560" y="204" font-size="17" font-weight="400" fill="#334155">·</text>
      <text x="576" y="204" font-size="17" font-weight="400" fill="#94a3b8">Lisboa</text>

      <rect x="648" y="190" width="10" height="18" fill="#22d3ee">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect width="1000" height="240" rx="16" fill="none" stroke="#17304d" stroke-width="2"/>
  </g>
</svg>
